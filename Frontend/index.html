    class HomeAluno extends React.Component {

                    const cargaEmAndamento = minhasTurmas.reduce((acc, t) => acc + t.cargaHoraria, 0);

                    const chamadosPendentes = chamados.filter(c => c.status === 'pendente').length;
                    const chamadosRespondidos = chamados.filter(c => c.status === 'respondido').length;

//COMPONENTE TELA DE MATRÍCULAS DO ALUNO
class TelaMatriculas extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            filtroArea: 'Todas',
            avisoChoque: ''
        };
    }

    handleMatricular = (turma, minhasTurmas, alternarMatricula) => {
        const jaMatriculado = turma.alunosMatriculados.includes(this.props.matriculaAluno);

        if (!jaMatriculado) {
            const choque = minhasTurmas.find(t => t.horarioCodigo === turma.horarioCodigo);
            if (choque) {
                this.setState({
                    avisoChoque: `Choque de horário! Você já está matriculado em "${choque.disciplina}" no horário ${turma.horarioCodigo} (${turma.horarioTexto}).`
                });
                return;
            }
        }

        this.setState({ avisoChoque: '' });
        alternarMatricula(turma.id);
    }

    render() {
        return (
            <PortalContext.Consumer>
                {(contexto) => {
                    const { usuario, turmas, navegarPara, alternarMatricula } = contexto;
                    const { filtroArea, avisoChoque } = this.state;

                    const minhasTurmas = turmas.filter(t => t.alunosMatriculados.includes(usuario.matricula));
                    const turmasFiltradas = filtroArea === 'Todas'
                        ? turmas
                        : turmas.filter(t => t.area === filtroArea);

                    return (
                        <div className="container my-4">
                            <div className="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                                <button className="btn-unisinos-outline" onClick={() => navegarPara('homeAluno')}>
                                    <i className="bi bi-arrow-left me-1"></i> Voltar para Home
                                </button>

                                <div className="px-4 py-2 bg-white border rounded shadow-sm fw-bold fs-5" style={{ color: '#214099' }}>
                                    Matricule-se
                                </div>

                                <div className="d-flex align-items-center gap-2 bg-white px-3 py-2 border rounded">
                                    <i className="bi bi-funnel-fill" style={{ color: '#214099' }}></i>
                                    <span className="small fw-semibold">Área:</span>
                                    <select
                                        className="form-select form-select-sm border-0 fw-semibold"
                                        style={{ width: 'auto', color: '#214099' }}
                                        value={filtroArea}
                                        onChange={(e) => this.setState({ filtroArea: e.target.value })}
                                    >
                                        <option value="Todas">Todas as áreas</option>
                                        <option value="Programação">Programação</option>
                                        <option value="Gestão e Negócios">Gestão e Negócios</option>
                                    </select>
                                </div>
                            </div>

                            {avisoChoque && (
                                <div className="alert alert-warning alert-dismissible fade show" role="alert">
                                    <i className="bi bi-exclamation-triangle-fill me-2"></i>
                                    {avisoChoque}
                                    <button type="button" className="btn-close" onClick={() => this.setState({ avisoChoque: '' })}></button>
                                </div>
                            )}

                            <div className="row g-4" style={{ maxHeight: '65vh', overflowY: 'auto' }}>
                                {turmasFiltradas.map(turma => {
                                    const matriculado = turma.alunosMatriculados.includes(usuario.matricula);

                                    return (
                                        <div key={turma.id} className="col-md-6 col-lg-3">
                                            <div className="card-unisinos h-100 d-flex flex-column justify-content-between overflow-hidden">
                                                <div className="p-3">
                                                    <span className="badge bg-light text-primary border mb-2">{turma.area}</span>
                                                    <h6 className="fw-bold mb-2">{turma.disciplina}</h6>
                                                    <div className="small text-muted mb-1">
                                                        <i className="bi bi-person-video3 me-1"></i> {turma.professor}
                                                    </div>
                                                    <div className="small text-muted mb-1">
                                                        <i className="bi bi-clock-history me-1"></i> Cód. <strong>{turma.horarioCodigo}</strong> • {turma.horarioTexto}
                                                    </div>
                                                    <div className="small text-muted">
                                                        <i className="bi bi-people me-1"></i> {turma.alunosMatriculados.length} aluno(s) inscrito(s)
                                                    </div>
                                                </div>

                                                <button
                                                    className="w-100 py-2 border-0 fw-semibold text-white"
                                                    style={{ backgroundColor: matriculado ? '#16a34a' : '#214099' }}
                                                    onClick={() => this.handleMatricular(turma, minhasTurmas, alternarMatricula)}
                                                >
                                                    {matriculado ? (
                                                        <span><i className="bi bi-check-circle-fill me-1"></i> Matriculado (Cancelar)</span>
                                                    ) : (
                                                        <span><i className="bi bi-plus-circle me-1"></i> Matricular-se</span>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }}
            </PortalContext.Consumer>
        );
    }
}

//COMPONENTE TELA DE ATENDIMENTO DO ALUNO
class TelaAtendimentoAluno extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            mostrarForm: true,
            assunto: 'Dúvida de Matrícula',
            destinatario: 'Prof. Ricardo Alves',
            mensagem: '',
            sucesso: false
        };
    }

    handleEnviar = (e, adicionarChamado) => {
        e.preventDefault();
        if (!this.state.mensagem.trim()) return;

        adicionarChamado({
            assunto: this.state.assunto,
            destinatario: this.state.destinatario,
            mensagem: this.state.mensagem
        });

        this.setState({ mensagem: '', sucesso: true });
        setTimeout(() => this.setState({ sucesso: false }), 3000);
    }

    render() {
        return (
            <PortalContext.Consumer>
                {(contexto) => {
                    const { chamados, navegarPara, adicionarChamado } = contexto;

                    return (
                        <div className="container my-4">
                            <div className="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                                <button className="btn-unisinos-outline" onClick={() => navegarPara('homeAluno')}>
                                    <i className="bi bi-arrow-left me-1"></i> Voltar para Home
                                </button>

                                <div className="px-4 py-2 bg-white border rounded shadow-sm fw-bold fs-5" style={{ color: '#214099' }}>
                                    Atendimento / Chamados
                                </div>

                                <div style={{ width: '140px' }}></div>
                            </div>

                            <div className="row g-4">
                                <div className="col-lg-7">
                                    <button
                                        className="btn-unisinos mb-3"
                                        onClick={() => this.setState({ mostrarForm: !this.state.mostrarForm })}
                                    >
                                        <i className="bi bi-plus-lg me-1"></i> Novo Chamado
                                    </button>

                                    {this.state.sucesso && (
                                        <div className="alert alert-success py-2 small">
                                            <i className="bi bi-check-circle-fill me-1"></i> Protocolo enviado com sucesso!
                                        </div>
                                    )}

                                    {this.state.mostrarForm && (
                                        <form className="card-unisinos p-4" onSubmit={(e) => this.handleEnviar(e, adicionarChamado)}>
                                            <div className="row g-3 mb-3">
                                                <div className="col-md-6">
                                                    <label className="form-label small fw-semibold">Assunto da Solicitação</label>
                                                    <select
                                                        className="form-select"
                                                        value={this.state.assunto}
                                                        onChange={(e) => this.setState({ assunto: e.target.value })}
                                                    >
                                                        <option value="Dúvida de Matrícula">Dúvida de Matrícula</option>
                                                        <option value="Ajuste de Grade">Ajuste de Grade</option>
                                                        <option value="Quebra de Pré-requisito">Quebra de Pré-requisito</option>
                                                    </select>
                                                </div>

                                                <div className="col-md-6">
                                                    <label className="form-label small fw-semibold">Destinatário (Docente / Coordenação)</label>
                                                    <select
                                                        className="form-select"
                                                        value={this.state.destinatario}
                                                        onChange={(e) => this.setState({ destinatario: e.target.value })}
                                                    >
                                                        <option value="Prof. Ricardo Alves">Prof. Ricardo Alves</option>
                                                        <option value="Profa. Mariana Costa">Profa. Mariana Costa</option>
                                                        <option value="Prof. Carlos Mendes">Prof. Carlos Mendes</option>
                                                        <option value="Prof. Lucas Ferreira">Prof. Lucas Ferreira</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="mb-3">
                                                <label className="form-label small fw-semibold">Descrição do Chamado</label>
                                                <textarea
                                                    className="form-control"
                                                    rows="5"
                                                    placeholder="Descreva sua dúvida ou solicitação acadêmica..."
                                                    value={this.state.mensagem}
                                                    onChange={(e) => this.setState({ mensagem: e.target.value })}
                                                    required
                                                ></textarea>
                                            </div>

                                            <div className="text-end">
                                                <button type="submit" className="btn-unisinos">
                                                    <i className="bi bi-send me-1"></i> Enviar Chamado
                                                </button>
                                            </div>
                                        </form>
                                    )}
                                </div>

                                <div className="col-lg-5">
                                    <div className="card-unisinos overflow-hidden">
                                        <div className="card-header-unisinos">
                                            <i className="bi bi-list-ul me-2"></i>Meus Protocolos
                                        </div>
                                        <div className="list-group list-group-flush" style={{ maxHeight: '55vh', overflowY: 'auto' }}>
                                            {chamados.map(chamado => (
                                                <div key={chamado.id} className="list-group-item py-3">
                                                    <div className="d-flex justify-content-between align-items-center mb-1">
                                                        <span className="fw-bold small">{chamado.assunto}</span>
                                                        <span className="small d-flex align-items-center gap-1">
                                                            <span className={`status-dot ${chamado.status === 'respondido' ? 'status-respondido' : 'status-pendente'}`}></span>
                                                            {chamado.status === 'respondido' ? 'Respondido' : 'Pendente'}
                                                        </span>
                                                    </div>
                                                    <div className="small text-muted mb-1">
                                                        Para: <strong>{chamado.destinatario}</strong> • {chamado.data}
                                                    </div>
                                                    <p className="small mb-2">{chamado.mensagem}</p>

                                                    {chamado.resposta && (
                                                        <div className="p-2 rounded bg-light border-start border-3 border-success small">
                                                            <strong>Retorno:</strong> {chamado.resposta}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }}
            </PortalContext.Consumer>
        );
    }
}

// GESTÃO DE OFERTAS DE TURMAS (INSTITUCIONAL)
class TelaOfertasTurmas extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            disciplina: '',
            area: 'Programação',
            horarioCodigo: '64',
            aviso: ''
        };
    }

    mapaHorarios = {
        '21': 'Segunda - Manhã',
        '24': 'Segunda - Noite',
        '34': 'Terça - Noite',
        '44': 'Quarta - Noite',
        '54': 'Quinta - Noite',
        '64': 'Sexta - Noite'
    };

    handleCriarOferta = (e, usuario, adicionarTurma) => {
        e.preventDefault();
        if (!this.state.disciplina.trim()) return;

        adicionarTurma({
            disciplina: this.state.disciplina,
            area: this.state.area,
            professor: usuario.nome,
            horarioCodigo: this.state.horarioCodigo,
            horarioTexto: this.mapaHorarios[this.state.horarioCodigo]
        });

        this.setState({
            disciplina: '',
            aviso: 'Nova oferta de turma publicada com sucesso!'
        });
        setTimeout(() => this.setState({ aviso: '' }), 3000);
    }

    render() {
        return (
            <PortalContext.Consumer>
                {(contexto) => {
                    const { usuario, turmas, navegarPara, adicionarTurma, removerTurma } = contexto;

                    return (
                        <div className="container my-4">

                                <div className="px-4 py-2 bg-white border rounded shadow-sm fw-bold fs-5" style={{ color: '#214099' }}>

                                <div style={{ width: '140px' }}></div>

                            {/* Formulário para nova turma */}

                                    <i className="bi bi-plus-circle me-2"></i>Ofertar Nova Turma (Padrão Unisinos)
                                </h6>

                                {this.state.aviso && (
                                    <div className="alert alert-success py-2 small">{this.state.aviso}</div>
                                )}

                                <div className="row g-3 align-items-end">
                                    <div className="col-md-4">
                                        <label className="form-label small fw-semibold">Nome da Disciplina</label>
                                        <input
                                            type="text"

                                            value={this.state.disciplina}
                                            onChange={(e) => this.setState({ disciplina: e.target.value })}

                                        />
                                    </div>

                                    <div className="col-md-3">
                                        <label className="form-label small fw-semibold">Área Temática</label>
                                        <select
                                            className="form-select"
                                            value={this.state.area}
                                            onChange={(e) => this.setState({ area: e.target.value })}
                                        >
                                            <option value="Programação">Programação</option>
                                            <option value="Gestão e Negócios">Gestão e Negócios</option>
                                        </select>
                                    </div>

                                    <div className="col-md-3">
                                        <label className="form-label small fw-semibold">Turno / Horário Unisinos</label>
                                        <select
                                            className="form-select"
                                            value={this.state.horarioCodigo}
                                            onChange={(e) => this.setState({ horarioCodigo: e.target.value })}

                                            <option value="54">54 - Quinta Noite</option>

// 6.3 COMPONENTE DE CHAMADOS (INSTITCIONAL)
class TelaChamadosProf extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            filtroStatus: 'todos',
            respostasDigitadas: {}
        };
    }

    handleResponder = (chamadoId, responderChamado) => {
        const texto = this.state.respostasDigitadas[chamadoId];
        if (!texto || !texto.trim()) return;

        responderChamado(chamadoId, texto);
        this.setState({
            respostasDigitadas: { ...this.state.respostasDigitadas, [chamadoId]: '' }
        });
    }

    render() {
        return (
            <PortalContext.Consumer>
                {(contexto) => {
                    const { chamados, navegarPara, responderChamado } = contexto;
                    const { filtroStatus, respostasDigitadas } = this.state;

                    const totalPendentes = chamados.filter(c => c.status === 'pendente').length;

                    const chamadosFiltrados = chamados.filter(c => {
                        if (filtroStatus === 'todos') return true;
                        return c.status === filtroStatus;
                    });

                    return (
                        <div className="container my-4">
                            {/* Topo */}
                            <div className="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                                <button className="btn-unisinos-outline" onClick={() => navegarPara('homeInstitucional')}>
                                    <i className="bi bi-arrow-left me-1"></i> Voltar para Home
                                </button>

                                <div className="px-4 py-2 bg-white border rounded shadow-sm fw-bold fs-5" style={{ color: '#214099' }}>
                                    Chamados Acadêmicos
                                </div>

                                <div style={{ width: '140px' }}></div>
                            </div>

                            {/* Barra com Card Pendentes à esquerda + Filtros à direita */}
                            <div className="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                                <div className="card-unisinos overflow-hidden text-center" style={{ minWidth: '140px' }}>
                                    <div className="px-3 py-1 small fw-bold text-secondary bg-light">Pendentes</div>
                                    <div className="py-2 text-white fw-bold fs-5" style={{ backgroundColor: '#214099' }}>
                                        {totalPendentes}
                                    </div>
                                </div>

                                <div className="d-flex align-items-center gap-2 bg-white px-3 py-2 border rounded">
                                    <i className="bi bi-funnel-fill" style={{ color: '#214099' }}></i>
                                    <span className="small fw-semibold">Filtros:</span>
                                    <select
                                        className="form-select form-select-sm border-0 fw-semibold"
                                        style={{ width: 'auto', color: '#214099' }}
                                        value={filtroStatus}
                                        onChange={(e) => this.setState({ filtroStatus: e.target.value })}
                                    >
                                        <option value="todos">Todos os chamados</option>
                                        <option value="pendente">Não respondidos (Pendentes)</option>
                                        <option value="respondido">Respondidos</option>
                                    </select>
                                </div>
                            </div>

                            {/* grid de cards dos chamados */}
                            <div className="row g-4">
                                {chamadosFiltrados.map(chamado => (
                                    <div key={chamado.id} className="col-md-6 col-lg-4">
                                        <div className="card-unisinos p-3 h-100 d-flex flex-column justify-content-between">
                                            <div>
                                                <div className="d-flex justify-content-between align-items-center mb-2">
                                                    <span className="badge bg-light text-primary border">{chamado.assunto}</span>
                                                    <span className="small fw-semibold d-flex align-items-center gap-1">
                                                        <span className={`status-dot ${chamado.status === 'respondido' ? 'status-respondido' : 'status-pendente'}`}></span>
                                                        {chamado.status === 'respondido' ? 'Respondido' : 'Pendente'}
                                                    </span>
                                                </div>

                                                <div className="small text-muted mb-2">
                                                    Destinatário: <strong>{chamado.destinatario}</strong> • {chamado.data}
                                                </div>

                                                <p className="small bg-light p-2 rounded border mb-3">
                                                    "{chamado.mensagem}"
                                                </p>
                                            </div>

                                            {chamado.status === 'respondido' ? (
                                                <div className="p-2 rounded bg-success bg-opacity-10 border border-success small">
                                                    <strong>Parecer enviado:</strong> {chamado.resposta}
                                                </div>
                                            ) : (
                                                <div>
                                                    <input
                                                        type="text"
                                                        className="form-control form-control-sm mb-2"
                                                        placeholder="Escreva a resposta institucional..."
                                                        value={respostasDigitadas[chamado.id] || ''}
                                                        onChange={(e) => this.setState({
                                                            respostasDigitadas: {
                                                                ...respostasDigitadas,
                                                                [chamado.id]: e.target.value
                                                            }
                                                        })}
                                                    />
                                                    <button
                                                        className="btn-unisinos btn-sm w-100"
                                                        onClick={() => this.handleResponder(chamado.id, responderChamado)}
                                                    >
                                                        <i className="bi bi-check2-circle me-1"></i> Responder e Concluir
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }}
            </PortalContext.Consumer>
        );
    }
}

class App extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            telaAtual: 'login',
            usuario: null,
            disciplinasConcluidas: [
                { id: 101, nome: 'Algoritmos e Programação', cargaHoraria: 60 },
                { id: 102, nome: 'Arquitetura de Computadores', cargaHoraria: 60 },
                { id: 103, nome: 'Banco de Dados I', cargaHoraria: 60 }
            ],
            turmas: [],
            chamados: []
        };
    }

    componentDidMount() {
        const API_URL = 'http://localhost:3001';

        Promise.all([
            fetch(`${API_URL}/turmas`).then(res => res.json()),
            fetch(`${API_URL}/chamados`).then(res => res.json())
        ])
        .then(([turmasApi, chamadosApi]) => {
            this.setState({ turmas: turmasApi, chamados: chamadosApi });
        })
        .catch((erro) => {
            console.error('Erro ao conectar com o back-end:', erro);
        });
    }

    navegarPara = (novaTela) => {
        this.setState({ telaAtual: novaTela });
    }

    fazerLogin = (tipoPerfil) => {
        if (tipoPerfil === 'aluno') {
            this.setState({
                usuario: { tipo: 'aluno', nome: 'Gabriel Martens da Silva', matricula: '202610849' },
                telaAtual: 'homeAluno'
            });
        } else {
            this.setState({
                usuario: { tipo: 'institucional', nome: 'Prof. Ricardo Alves', registro: 'DOC-402' },
                telaAtual: 'homeInstitucional'
            });
        }
    }

    fazerLogout = () => {
        this.setState({ usuario: null, telaAtual: 'login' });
    }

    alternarMatricula = (turmaId) => {
        const matriculaAtual = this.state.usuario.matricula;

        fetch(`http://localhost:3001/turmas/${turmaId}/matricular`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matricula: matriculaAtual })
        })
        .then(res => res.json())
        .then(turmasAtualizadas => {
            this.setState({ turmas: turmasAtualizadas });
        });
    }

    adicionarChamado = (novoChamado) => {
        fetch('http://localhost:3001/chamados', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novoChamado)
        })
        .then(res => res.json())
        .then(chamadoCriado => {
            this.setState({ chamados: [chamadoCriado, ...this.state.chamados] });
        });
    }

    adicionarTurma = (novaTurma) => {
        fetch('http://localhost:3001/turmas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novaTurma)
        })
        .then(res => res.json())
        .then(turmaCriada => {
            this.setState({ turmas: [...this.state.turmas, turmaCriada] });
        });
    }

    removerTurma = (turmaId) => {
        fetch(`http://localhost:3001/turmas/${turmaId}`, {
            method: 'DELETE'
        })
        .then(() => {
            this.setState({ turmas: this.state.turmas.filter(t => t.id !== turmaId) });
        });
    }

    responderChamado = (chamadoId, textoResposta) => {
        fetch(`http://localhost:3001/chamados/${chamadoId}/responder`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ resposta: textoResposta })
        })
        .then(res => res.json())
        .then(chamadosAtualizados => {
            this.setState({ chamados: chamadosAtualizados });
        });
    }

    render() {
        const { telaAtual, usuario } = this.state;

        const valorContexto = {
            ...this.state,
            navegarPara: this.navegarPara,
            alternarMatricula: this.alternarMatricula,
            adicionarChamado: this.adicionarChamado,
            adicionarTurma: this.adicionarTurma,
            removerTurma: this.removerTurma,
            responderChamado: this.responderChamado,
        };

        return (
            <PortalContext.Provider value={valorContexto}>
                <div>
                    <Navbar 
                        telaAtual={telaAtual} 
                        usuario={usuario} 
                        onNavegar={this.navegarPara} 
                        onLogout={this.fazerLogout} 
                    />

                    {telaAtual === 'login' && <TelaLogin onLogin={this.fazerLogin} />}
                    {telaAtual === 'sobre' && <TelaSobre onNavegar={this.navegarPara} />}
                    {telaAtual === 'homeAluno' && <HomeAluno />}
                    {telaAtual === 'matriculasAluno' && <TelaMatriculasAluno />}
                    {telaAtual === 'atendimentoAluno' && <TelaAtendimentoAluno />}
                    {telaAtual === 'homeInstitucional' && <HomeInstitucional />}
                    {telaAtual === 'ofertasInstitucional' && <TelaOfertasTurmas />}
                </div>
            </PortalContext.Provider>
        );
    }
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
